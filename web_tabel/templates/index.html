<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Табель учета web-tabel-{{APP_VERSION}}</title>
  <link rel="stylesheet" href="{{APP_PREFIX}}/static/style.css?v={{APP_VERSION}}">
  <script>
    window.APP_CONFIG = {
      APP_PREFIX: "{{APP_PREFIX}}",
      CAN_EDIT: {{CAN_EDIT}}
    };
  </script>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="titlebox">
        <h1>Табель учета</h1>
        <div class="sub">Версия web-tabel-{{APP_VERSION}}</div>
      </div>
      <div class="controls">
        <a class="home-link" href="/">На главную</a>
        <div class="nav" id="sectionNav">
          <button class="nav-tab active" onclick="switchTab('months')">📅 МЕСЯЦЫ</button>
          <button class="nav-tab" onclick="window.location.href='/spravochnik?tab=norms'">📊 ДАННЫЕ</button>
          <button class="nav-tab" onclick="window.location.href='/spravochnik?tab=employees'">👥 СОТРУДНИКИ</button>
          <button class="nav-tab" onclick="switchTab('vacations')">🌴 ОТПУСКА</button>
        </div>
        <div class="toolbar">
          <label>Год: <input type="number" id="yearInput" onchange="loadState()" min="2000" max="2100" style="width:80px; padding: 6px;"></label>
          <input type="hidden" id="monthInput" value="6">
          <div class="json-menu">
            <button class="dropdown-toggle" onclick="this.parentElement.classList.toggle('open')">Отчеты ▼</button>
            <div class="json-menu-panel">
              <button onclick="exportMilk('комп')">Молоко (комп)</button>
              <button onclick="exportMilk('план')">Молоко (план)</button>
              <button onclick="exportMilk('факт')">Молоко (факт)</button>
            </div>
          </div>
          <button onclick="saveState()" id="saveBtn" style="display:none;" class="save-ready">Сохранить</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="tab-content active" id="tab-months">
        <div class="months-row">
          <div class="month-strip" id="monthStrip"></div>
        </div>
        <div class="table-wrap month-table-wrap">
          <table id="tabelGrid" class="month-table compact">
            <thead><tr id="tabelHeader"></tr></thead>
            <tbody id="tabelBody"></tbody>
          </table>
        </div>
      </div>

      <div class="tab-content" id="tab-data">
        <div class="table-wrap month-table-wrap">
          <table id="dataGrid" class="month-table compact norms-table">
            <thead>
              <tr><th>Месяц</th><th>Кал. дни</th><th>Раб. дни</th><th>Вых и празд.</th><th>40-ч</th><th>36-ч</th><th>Переносы<br>дней</th><th>Прадники</th></tr>
            </thead>
            <tbody id="dataBody"></tbody>
          </table>
        </div>
      </div>

      <div class="tab-content" id="tab-employees">
        <div class="table-wrap month-table-wrap">
          <table id="employeesGrid" class="month-table compact">
            <thead>
              <tr><th style="width: 30px;">№</th><th>Должность</th><th>ФИО</th><th>ФИО полное</th><th>Таб. №</th><th>Молоко<br>комп</th><th>Молоко<br>выдача</th><th>Молоко<br>прим.</th></tr>
            </thead>
            <tbody id="employeesBody"></tbody>
          </table>
        </div>
      </div>

      <div class="tab-content" id="tab-vacations">
        <div class="table-wrap month-table-wrap">
          <table id="vacationsGrid" class="month-table compact">
            <thead>
              <tr><th style="width: 30px;">№</th><th>Таб</th><th>ФИО</th><th>Нач</th><th>Кон</th><th>Дни</th><th style="width: 10px;"></th><th>Нач</th><th>Кон</th><th>Дни</th><th style="width: 10px;"></th><th>Нач</th><th>Кон</th><th>Дни</th></tr>
            </thead>
            <tbody id="vacationsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("click", function(e) {
      if (!e.target.closest('.json-menu')) {
        document.querySelectorAll('.json-menu').forEach(m => m.classList.remove('open'));
      }
    });
  </script>
  <script src="{{APP_PREFIX}}/static/script.js?v={{APP_VERSION}}"></script>
</body>
</html>
