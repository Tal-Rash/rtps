name: Deploy RTPS to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USER:=root}"
          : "${VPS_PORT:=22}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY secret}"

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -se' <<'EOF'
          set -euo pipefail

          cd /opt/rtps
          git config core.sshCommand 'ssh -i /root/.ssh/id_ed25519_github -o IdentitiesOnly=yes -o BatchMode=yes'

          backup_dir="$(mktemp -d)"

          backup_path() {
            if [ -e "$1" ]; then
              mkdir -p "$backup_dir/$(dirname "$1")"
              cp -a "$1" "$backup_dir/$1"
            fi
          }

          restore_path() {
            if [ -e "$backup_dir/$1" ]; then
              rm -rf "$1"
              mkdir -p "$(dirname "$1")"
              cp -a "$backup_dir/$1" "$1"
            fi
          }

          backup_path base/common_database.db
          backup_path data
          backup_path web_main/data
          backup_path web_spravochnik/data

          git fetch origin main
          git reset --hard origin/main

          restore_path base/common_database.db
          restore_path data
          restore_path web_main/data
          restore_path web_spravochnik/data

          for unit in deploy/*.service; do
            [ -e "$unit" ] || continue
            install -m 644 "$unit" "/etc/systemd/system/$(basename "$unit")"
          done

          systemctl daemon-reload

          mapfile -t services < <(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' deploy/services.txt)
          if [ "${#services[@]}" -eq 0 ]; then
            echo "deploy/services.txt is empty" >&2
            exit 1
          fi

          for service in "${services[@]}"; do
            systemctl restart "$service"
          done

          systemctl reload nginx
          EOF
