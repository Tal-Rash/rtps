name: Deploy RTPS to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USER:=root}"
          : "${VPS_PORT:=22}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY secret}"

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -se' <<'EOF'
          set -euo pipefail

          cd /opt/rtps

          db_backup=""
          if [ -f base/common_database.db ]; then
            db_backup="$(mktemp)"
            cp -a base/common_database.db "$db_backup"
          fi

          git fetch origin main
          git reset --hard origin/main

          if [ -n "$db_backup" ] && [ -f "$db_backup" ]; then
            cp -a "$db_backup" base/common_database.db
          fi

          systemctl restart rtps.service
          EOF
