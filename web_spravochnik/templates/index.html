<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Справочник</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #fff;
      --line: #d9e2ef;
      --text: #102033;
      --muted: #607086;
      --accent: #276ef1;
      --soft: #eaf1ff;
      --shadow: 0 12px 32px rgba(16, 32, 51, 0.08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { overflow-y: scroll; scrollbar-gutter: stable; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #e8eefb, #f7f9fc 150px) fixed;
      color: var(--text);
    }
    .wrap {
      max-width: 1700px;
      margin: 0 auto;
      padding: 16px;
    }
    /* Единая плашка шапки в стиле Замер КП */
    .top {
      position: sticky;
      top: 12px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    /* Верхняя строка: заголовок и функциональные кнопки */
    .top-row {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .titlebox h1, h1 { margin: 0; font-size: 22px; }
    .muted { color: var(--muted); font-size: 13px; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button, a, select {
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 8px 12px;
      background: #fff;
      color: var(--accent);
      font-weight: 500;
      text-decoration: none;
      font: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover:not(:disabled), a:hover {
      background: var(--soft);
      color: var(--accent);
      box-shadow: 0 0 0 2px rgba(39, 110, 241, 0.12);
    }
    .home-link {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: #fff;
      padding: 8px 12px;
      color: var(--accent);
      font-weight: 500;
      text-decoration: none;
    }
    .home-link:hover {
      background: var(--soft);
    }
    button.primary {
      background: var(--accent) !important;
      border-color: var(--accent) !important;
      color: #fff !important;
    }
    button.primary:hover {
      background: #1f63df !important;
      border-color: #1f63df !important;
    }
    button.primary:disabled { opacity: .78; }
    /* Тонкий разделитель между строками шапки */
    .top-divider {
      height: 1px;
      background: var(--line);
      margin: 0;
      opacity: 0.8;
    }
    /* Нижняя строка: вкладки разделов */
    .tabs {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin: 0;
      padding: 0;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .tab {
      flex: 0 0 auto;
      background: #fff;
      border: 1px solid var(--accent);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      color: var(--accent);
      transition: all 0.15s ease;
    }
    .tab:hover {
      background: var(--soft);
      box-shadow: 0 0 0 2px rgba(39, 110, 241, 0.12);
    }
    .tab.active {
      background: var(--accent) !important;
      color: #fff !important;
      border-color: var(--accent) !important;
      box-shadow: 0 2px 8px rgba(39, 110, 241, 0.25);
    }
    /* Основные панели содержимого */
    .panel {
      display: none;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      overflow: auto;
    }
    .table-shell {
      margin-top: 12px;
      background: #fff;
      border: 1px solid var(--accent);
      border-radius: 14px;
      overflow: hidden;
    }
    .panel.active { display: block; }
    table { border-collapse: collapse; width: 100%; min-width: 760px; }
    table.norms-table { table-layout: fixed; }
    table.employees-table { table-layout: fixed; }
    th, td { border: 1px solid var(--line); padding: 0; height: 34px; text-align: center; overflow: hidden; }
    th { background: #eef4fb; font-weight: 700; }
    table.employees-table td { height: auto; vertical-align: middle; position: relative; }
    table.employees-table th { height: 34px; vertical-align: middle; }
    table.norms-table th, table.norms-table td { white-space: nowrap; }
    table.employees-table th, table.employees-table td { white-space: normal; }
    td input { width: 100%; height: 34px; border: 0; padding: 6px 8px; font: inherit; text-align: center; background: transparent; }
    td textarea { width: 100%; min-height: 34px; border: 0; padding: 6px 8px; font: inherit; text-align: center; background: transparent; resize: none; overflow: hidden; display: block; line-height: 1.25; box-sizing: border-box; }
    td input[type=checkbox] { width: auto; height: auto; }
    table.employees-table td input[type=checkbox] { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .left { text-align: left !important; }
    .rowbar { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 10px; }
    .inventory-actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; margin-bottom: 10px; }
    .selected-row { outline: 2px solid #7aa7ff; outline-offset: -2px; background: #f3f8ff; }
    .deleted-row { opacity: .55; }
    .deleted-row td, .deleted-row td input { color: #8b96a8; text-decoration: line-through; text-decoration-thickness: 1.5px; }
    td input:focus,
    td input:focus-visible {
      outline: none;
      box-shadow: none;
    }
    /* Стили выделения и копирования ячеек таблицы сотрудников как в Excel */
    table.employees-table tr.selected-row {
      outline: none;
      background: transparent;
    }
    table.employees-table td.selected-cell {
      background: #e8f0fe !important;
    }
    table.employees-table td.selected-cell input,
    table.employees-table td.selected-cell textarea {
      background: transparent !important;
    }
    table.employees-table td.row-num {
      user-select: none;
      cursor: pointer;
      background: #eef4fb;
      font-weight: 600;
      color: #3b4b60;
    }
    table.employees-table td.row-num:hover {
      background: #dbe7fc;
    }
    table.employees-table td.row-num.selected-row-num {
      background: #c2d7fe !important;
      font-weight: 700;
      color: #102033;
    }
    table.employees-table th.emp-corner-th,
    table.employees-table th.emp-col-th {
      user-select: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    table.employees-table th.emp-corner-th:hover,
    table.employees-table th.emp-col-th:hover {
      background: #dbe7fc;
    }
    table.employees-table th.emp-col-th.selected-col-th {
      background: #c2d7fe !important;
      color: #102033;
    }
    /* Всплывающее уведомление о копировании */
    .copy-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(16, 32, 51, 0.92);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      z-index: 10000;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }
    .copy-toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(16, 32, 51, .4); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal-backdrop.show { display: flex; }
    .modal { width: min(520px, 100%); background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: 0 20px 60px rgba(16, 32, 51, .2); }
    .modal h2 { margin: 0 0 12px; font-size: 22px; }
    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-grid label { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
    .modal-grid input { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    .modal-actions button { min-width: 120px; }
  </style>
</head>
<body>
<div class="wrap">
  <!-- Единая шапка: верхняя строка с действиями, нижняя строка со вкладками -->
  <div class="top">
    <div class="top-row">
      <div class="titlebox">
        <h1>Справочник</h1>
      </div>
      <div class="actions">
        <a class="home-link" href="{{MAIN_SITE_URL}}/" onclick="return handleHomeClick(event)">На главную</a>
        <button id="cancelBtn" title="Отмена" aria-label="Отмена" onclick="cancelChanges()">↺</button>
        <button id="restoreBtn" title="Вернуть" aria-label="Вернуть" onclick="restoreChanges()">↻</button>
        <label>Год <select id="year" onchange="handleYearChange(event)"></select></label>
        <button id="saveBtn" onclick="saveAll()">Сохранить</button>
      </div>
    </div>
    <div class="top-divider"></div>
    <div class="tabs" role="tablist" aria-label="Разделы">
      <button class="tab active" type="button" onclick="showTab('norms', this)">Нормы времени</button>
      <button class="tab" type="button" onclick="showTab('employees', this)">Сотрудники</button>
      <button class="tab" type="button" onclick="showTab('inventory', this)">Локомотивы</button>
    </div>
  </div>
  <div id="norms" class="panel active"></div>
  <div id="employees" class="panel"></div>
  <div id="inventory" class="panel"></div>
</div>
<div id="addLocoModal" class="modal-backdrop" onclick="closeAddLocomotiveModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h2>Добавить локомотив</h2>
  <div class="modal-grid">
      <label>Серия
        <input id="newLocoSeries" autocomplete="off">
      </label>
      <label>Номер
        <input id="newLocoNumber" autocomplete="off">
      </label>
      <label>Год выпуска
        <input id="newLocoYear" type="number" min="1900" max="2100" step="1" autocomplete="off" placeholder="2026">
      </label>
      <label>Срок службы
        <input id="newLocoServiceLife" type="number" min="1" step="1" autocomplete="off" placeholder="25">
      </label>
      <label>Кол-во к. пар
        <input id="newLocoWheelPairs" type="number" min="1" step="1" value="6">
      </label>
      <label>Кол-во секций
        <input id="newLocoSections" type="number" min="1" step="1" value="1">
      </label>
      <label>Инвентарный №
        <input id="newLocoInv" autocomplete="off">
      </label>
      <label style="grid-column:1 / -1">8-значный номер
        <input id="newLocoEight" autocomplete="off" inputmode="numeric" maxlength="8" placeholder="00000000">
      </label>
    </div>
    <div class="modal-actions">
      <button type="button" onclick="closeAddLocomotiveModal()">Отмена</button>
      <button type="button" class="primary" onclick="submitAddLocomotive()">Добавить</button>
    </div>
  </div>
</div>
  <!-- Модальное окно подтверждения при несохранённых изменениях -->
  <div id="unsavedChangesModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(16,32,51,0.48); z-index:99999; align-items:center; justify-content:center; backdrop-filter:blur(4px);">
    <div style="background:#ffffff; border-radius:16px; padding:24px 28px; max-width:440px; width:90%; box-shadow:0 16px 40px rgba(16,32,51,0.2); text-align:center; font-family:inherit; border:1px solid #d9e2ef;">
      <h3 style="margin:0 0 10px; font-size:18px; color:#102033; font-weight:700;">Несохранённые изменения</h3>
      <p id="unsavedChangesMessage" style="margin:0 0 20px; font-size:14px; color:#475569; line-height:1.45;">Есть несохранённые изменения. Сохранить их перед переходом?</p>
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button id="unsavedSaveBtn" type="button" class="primary" style="padding:9px 18px; border-radius:8px; font-weight:600; cursor:pointer;">Сохранить</button>
        <button id="unsavedDiscardBtn" type="button" style="padding:9px 18px; border-radius:8px; font-weight:600; cursor:pointer; background:#ffffff; border:1px solid #cbd5e1; color:#334155;">Не сохранять</button>
        <button id="unsavedCancelBtn" type="button" style="padding:9px 18px; border-radius:8px; font-weight:600; cursor:pointer; background:#ffffff; border:1px solid #cbd5e1; color:#64748b;">Отмена</button>
      </div>
    </div>
  </div>

<script src="{{APP_PREFIX}}/static/jszip.min.js?v={{APP_VERSION}}"></script>
<script src="{{APP_PREFIX}}/static/xlsx.full.min.js?v={{APP_VERSION}}"></script>
<script>
const API = '{{APP_PREFIX}}';
const CAN_EDIT = {{CAN_EDIT}};
let state = null;
let savedState = null;
let canceledState = null;
  const headers = {
    norms: ['Месяц','Кал. дни','Раб. дни','Вых и празд.','40-ч','36-ч','Переносы дней','Праздники'],
    employees: ['Должность','ФИО','ФИО полное','Таб. №','Молоко комп','Молоко выдача','Дата приема','Дата искл.','Отпуск (дней)','Молоко прим.'],
    inventory: ['Серия','Номер','Инвентарный №','Кол-во КП','Ко-во секций','8-значный номер','Год выпуска','Срок службы']
  };

function fillYears(){
  const select = document.getElementById('year');
  const now = new Date().getFullYear();
  for(let y = now - 3; y <= now + 5; y++){
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    if(y === now) opt.selected = true;
    select.appendChild(opt);
  }
  select.onchange = handleYearChange;
}

async function loadState(){
  const year = document.getElementById('year').value;
  currentLoadedYear = year;
  const res = await fetch(`${API}/api/state?year=${year}`, {cache:'no-store'});
  if(!res.ok){ alert('Не удалось загрузить справочник'); return; }
  state = await res.json();
  savedState = cloneState(state);
  canceledState = null;
  renderAll();
}

function renderAll(){
  renderTable('norms', state.norms, false);
  renderTable('employees', state.employees, true);
  renderTable('inventory', state.inventory, true);
  const saveBtn = document.getElementById('saveBtn');
  if (saveBtn) {
    saveBtn.style.display = CAN_EDIT ? '' : 'none';
  }
  updateHistoryButtons();
  updateSaveButton();
  syncInventoryActionButtons();
}

function renderTable(name, rows, editableRows){
  const panel = document.getElementById(name);
  const rowbar = (editableRows && CAN_EDIT)
    ? (
      name === 'inventory'
        ? (() => {
            const selectedRow = selected.inventory >= 0 ? state.inventory[selected.inventory] : null;
            const isDeleted = selectedRow ? Number(selectedRow[8] || 0) > 0 : false;
            return `<div class="rowbar">
              <button type="button" onclick="openAddLocomotiveModal()">Добавить локомотив</button>
              <button id="inventoryDeleteBtn" type="button" onclick="softDeleteInventory()" ${selected.inventory < 0 || isDeleted ? 'disabled' : ''}>Удалить</button>
              <button id="inventoryRestoreBtn" type="button" onclick="restoreInventoryRow()" ${selected.inventory < 0 || !isDeleted ? 'disabled' : ''}>Восстановить</button>
              <button id="inventoryPurgeBtn" type="button" onclick="purgeSelectedInventory()" ${selected.inventory < 0 || !isDeleted ? 'disabled' : ''}>Окончательно удалить</button>
            </div>`;
          })()
        : (name === 'employees'
            ? `<div class="rowbar">
                <button type="button" onclick="copyEmpSelection()" title="Копировать выделенное в буфер обмена (Ctrl+C)">Копировать</button>
                <button type="button" onclick="addRow('${name}')">+ строку</button>
                <button type="button" onclick="deleteRow('${name}')">- строку</button>
              </div>`
            : `<div class="rowbar"><button type="button" onclick="addRow('${name}')">+ строку</button><button type="button" onclick="deleteRow('${name}')">- строку</button></div>`
          )
    )
    : (name === 'employees'
        ? `<div class="rowbar">
            <button type="button" onclick="copyEmpSelection()" title="Копировать выделенное в буфер обмена (Ctrl+C)">Копировать</button>
          </div>`
        : ''
      );
  const tableClass = name === 'norms' ? ' class="norms-table"' : '';
  const employeesTableClass = name === 'employees' ? ' class="employees-table"' : '';
  const colGroup = name === 'norms'
    ? `<colgroup>
        <col style="width:42px">
        <col style="width:150px">
        <col style="width:120px">
        <col style="width:120px">
        <col style="width:120px">
        <col style="width:120px">
        <col style="width:120px">
        <col style="width:200px">
        <col>
      </colgroup>`
    : name === 'employees'
      ? `<colgroup>
          <col style="width:42px">
          <col style="width:240px">
          <col style="width:160px">
          <col style="width:200px">
          <col style="width:110px">
          <col style="width:100px">
          <col style="width:100px">
          <col style="width:120px">
          <col style="width:120px">
          <col style="width:110px">
          <col>
        </colgroup>`
    : name === 'inventory'
      ? `<colgroup>
          <col style="width:42px">
          <col style="width:170px">
          <col style="width:170px">
          <col style="width:150px">
          <col style="width:120px">
          <col style="width:120px">
          <col style="width:150px">
          <col style="width:120px">
          <col style="width:120px">
        </colgroup>`
    : '';

  const theadHtml = name === 'employees'
    ? `<thead><tr><th class="emp-corner-th" style="width:42px" onclick="selectEmpAll()" title="Выделить всю таблицу (Ctrl+A)">№</th>` +
      headers[name].map((h, c) => `<th class="emp-col-th" data-col="${c}" title="Выделить столбец (клик или протягивание)">${h}</th>`).join('') +
      `</tr></thead>`
    : `<thead><tr><th style="width:42px">№</th>` + headers[name].map(h => `<th>${h}</th>`).join('') + `</tr></thead>`;

  let html = rowbar + '<div class="table-shell"><table' + (tableClass || employeesTableClass) + '>' + colGroup + theadHtml + '<tbody>';
  rows.forEach((row, r) => {
    const isDeleted = name === 'inventory' && Number(row[8] || 0) > 0;
    const isDraggable = (name === 'inventory' || name === 'employees') && CAN_EDIT;
    // Для таблицы сотрудников перетаскивание привязано к ячейке с номером строки (td.row-num)
    const trDraggable = (name === 'inventory' && CAN_EDIT)
      ? ` draggable="true" ondragstart="dragStartRow(event, '${name}', ${r})" ondragover="dragOverRow(event, '${name}', ${r})" ondrop="dropRow(event, '${name}', ${r})" ondragend="dragEndRow(event)"`
      : (name === 'employees' && CAN_EDIT)
        ? ` ondragover="dragOverRow(event, '${name}', ${r})" ondrop="dropRow(event, '${name}', ${r})"`
        : '';
    const isSelected = selected[name] === r;
    const rowClass = [
      isDeleted ? 'deleted-row' : '',
      isSelected ? 'selected-row' : '',
    ].filter(Boolean).join(' ');

    const rowNumCell = name === 'employees'
      ? `<td class="row-num" data-row="${r}" ${CAN_EDIT ? `draggable="true" ondragstart="dragStartRow(event, 'employees', ${r})" ondragend="dragEndRow(event)"` : ''} style="${isDraggable ? 'cursor:grab;' : 'cursor:pointer;'}" title="${isDraggable ? 'Клик — выделить строку, перетаскивание — изменить порядок' : 'Клик — выделить строку'}">${r + 1}</td>`
      : `<td style="${isDraggable ? 'cursor:grab;' : ''}">${r + 1}</td>`;

    html += `<tr class="${rowClass}" onclick="selectRow('${name}', ${r})"${trDraggable}>${rowNumCell}`;
    headers[name].forEach((_, c) => {
      const val = row[c] ?? '';
      if(name === 'employees' && (c === 4 || c === 5)){
        html += `<td class="emp-cell" data-row="${r}" data-col="${c}"><input type="checkbox" ${val ? 'checked' : ''} ${CAN_EDIT ? `onclick="event.stopPropagation()" onchange="setCell('${name}',${r},${c},this.checked)"` : 'disabled'}></td>`;
      } else if (name === 'employees' && (c === 6 || c === 7)) {
        html += `<td class="emp-cell" data-row="${r}" data-col="${c}"><input type="date" value="${escapeHtml(val)}" ${CAN_EDIT ? `onclick="event.stopPropagation(); selectRow('${name}', ${r});" onfocus="selectRow('${name}', ${r});" onchange="setCell('${name}',${r},${c},this.value)"` : 'disabled'}></td>`;
      } else if (name === 'employees' && c === 8) {
        html += `<td class="emp-cell" data-row="${r}" data-col="${c}"><input class="num" type="number" min="0" max="100" value="${escapeHtml(val !== '' && val !== null && val !== undefined ? val : 28)}" ${CAN_EDIT ? `onclick="event.stopPropagation(); selectRow('${name}', ${r});" onfocus="selectRow('${name}', ${r});" oninput="setCell('${name}',${r},${c},this.value===''?28:(parseInt(this.value)||0))"` : 'readonly'}></td>`;
      } else if (name === 'employees') {
        const cls = c < 3 ? 'left' : '';
        html += `<td class="emp-cell" data-row="${r}" data-col="${c}"><textarea class="${cls}" rows="1" ${CAN_EDIT ? `onclick="event.stopPropagation(); selectRow('${name}', ${r});" onfocus="selectRow('${name}', ${r}); autoResizeTextarea(this);" oninput="setCell('${name}',${r},${c},this.value); autoResizeTextarea(this);"` : 'readonly'}>${escapeHtml(val)}</textarea></td>`;
      } else if (name === 'inventory' && c === 2) {
        const cls = 'left';

(function initTableCustomLabels() {
  function applyCustomLabels() {
    try {
      const pairs = typeof getEmpReplacementPairs === 'function' ? getEmpReplacementPairs() : [];
      if (!pairs || !pairs.length) return;

      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
      let node;
      while ((node = walker.nextNode())) {
        let val = node.nodeValue;
        if (!val || !val.trim()) continue;
        let newVal = val;
        for (let p = 0; p < pairs.length; p++) {
          if (newVal.indexOf(pairs[p].from) !== -1) {
            newVal = newVal.split(pairs[p].from).join(pairs[p].to);
          }
        }
        if (newVal !== val) node.nodeValue = newVal;
      }

      const inputs = document.querySelectorAll('input, select, option, textarea');
      for (let i = 0; i < inputs.length; i++) {
        let el = inputs[i];
        if (el.tagName === 'OPTION' || el.tagName === 'option') {
          if (el.textContent) {
            let val = el.textContent, newVal = val;
            for (let p = 0; p < pairs.length; p++) {
              if (newVal.indexOf(pairs[p].from) !== -1) {
                newVal = newVal.split(pairs[p].from).join(pairs[p].to);
              }
            }
            if (newVal !== val) el.textContent = newVal;
          }
        }
        if (el.value) {
          let val = el.value, newVal = val;
          for (let p = 0; p < pairs.length; p++) {
            if (newVal.indexOf(pairs[p].from) !== -1) {
              newVal = newVal.split(pairs[p].from).join(pairs[p].to);
            }
          }
          if (newVal !== val) el.value = newVal;
        }
        if (el.title) {
          let val = el.title, newVal = val;
          for (let p = 0; p < pairs.length; p++) {
            if (newVal.indexOf(pairs[p].from) !== -1) {
              newVal = newVal.split(pairs[p].from).join(pairs[p].to);
            }
          }
          if (newVal !== val) el.title = newVal;
        }
        if (el.placeholder) {
          let val = el.placeholder, newVal = val;
          for (let p = 0; p < pairs.length; p++) {
            if (newVal.indexOf(pairs[p].from) !== -1) {
              newVal = newVal.split(pairs[p].from).join(pairs[p].to);
            }
          }
          if (newVal !== val) el.placeholder = newVal;
        }
      }
    } catch (e) {}
  }

  window.applyCustomLabels = applyCustomLabels;

  document.addEventListener("DOMContentLoaded", function () {
    applyCustomLabels();
    let timer = null;
    const observer = new MutationObserver(function () {
      if (timer) clearTimeout(timer);
      timer = setTimeout(applyCustomLabels, 10);
    });
    observer.observe(document.body, { childList: true, subtree: true });
  });
})();

/* ==========================================================================
 * Утилиты автоматической разанонимизации (расшифровки) отчетов Excel в браузере.
 * Комментарии к коду на русском языке.
 * ========================================================================== */

function getEmpReplacementPairs() {
  const raw = localStorage.getItem('rtps_emp_dict') || localStorage.getItem('rtps_employees_full_dict');
  if (!raw) return [];
  
  let map = null;
  try { map = JSON.parse(raw); } catch (e) { return []; }
  if (!map) return [];

  const flatMap = {};

  // Извлекает порядковый номер из строки вида ID_001, Работник №1 и т.д.
  function extractNum(idStr) {
    if (!idStr) return null;
    const clean = String(idStr)
      .replace(/ID_/g, '')
      .replace(/Работник\\s*№?\\s*/g, '')
      .replace(/СотрудникПолн\\s*№?\\s*/g, '')
      .replace(/Сотрудник\\s*№?\\s*/g, '')
      .replace(/Должность\\s*№?\\s*/g, '')
      .trim();
    const num = parseInt(clean, 10);
    return isNaN(num) ? null : num;
  }

  // Добавляет варианты написания текстового поля (Работник №1, Работник №001 и т.д.)
  function addFieldVariants(prefix, num, val) {
    const sNum = String(num);
    const pNum = (num < 10 ? '00' : (num < 100 ? '0' : '')) + num;
    const valStr = String(val);

    flatMap[prefix + " №" + num] = valStr;
    flatMap[prefix + " №" + sNum] = valStr;
    flatMap[prefix + " №" + pNum] = valStr;
    flatMap[prefix + " № " + sNum] = valStr;
    flatMap[prefix + " № " + pNum] = valStr;
  }

  // Добавляет варианты написания ID (ID_001, ID_1 и т.д.)
  function addIdVariants(num, val) {
    const sNum = String(num);
    const pNum = (num < 10 ? '00' : (num < 100 ? '0' : '')) + num;
    const valStr = String(val);

    flatMap["ID_" + pNum] = valStr;
    flatMap["ID_" + sNum] = valStr;
    flatMap["ID_" + num] = valStr;
  }

  if (Array.isArray(map)) {
    for (let i = 0; i < map.length; i++) {
      let rec = map[i];
      if (!rec) continue;

      let num = extractNum(rec.id || rec.tab || rec.tab_num);
      if (num === null) num = i + 1;

      let shortF = rec.shortFio || rec.fio || rec.name || rec.short_name || '';
      let fullF = rec.fullFio || rec.full_name || rec.fio || rec.name || '';
      let pos = rec.pos || rec.position || '';
      let tab = rec.tab || rec.tab_num || rec.id || '';

      if (shortF) addFieldVariants("Работник", num, shortF);
      if (fullF) {
        addFieldVariants("СотрудникПолн", num, fullF);
        addFieldVariants("Сотрудник", num, fullF);
      }
      if (pos) addFieldVariants("Должность", num, pos);
      if (tab) {
        addIdVariants(num, tab);
        if (rec.id) flatMap[String(rec.id)] = String(tab);
      }
    }
  } else if (typeof map === 'object') {
    for (let k in map) {
      if (map.hasOwnProperty(k) && k && map[k]) {
        const valStr = String(map[k]);
        flatMap[k] = valStr;
        let num = extractNum(k);
        if (num !== null) {
          if (k.startsWith("Работник")) {
            addFieldVariants("Работник", num, valStr);
          } else if (k.startsWith("СотрудникПолн")) {
            addFieldVariants("СотрудникПолн", num, valStr);
            addFieldVariants("Сотрудник", num, valStr);
          } else if (k.startsWith("Сотрудник")) {
            addFieldVariants("Сотрудник", num, valStr);
            addFieldVariants("СотрудникПолн", num, valStr);
          } else if (k.startsWith("Должность")) {
            addFieldVariants("Должность", num, valStr);
          } else if (k.startsWith("ID_") || /^\\d+$/.test(k)) {
            addIdVariants(num, valStr);
          }
        }
      }
    }
  }

  const pairs = [];
  for (let k in flatMap) {
    if (flatMap.hasOwnProperty(k) && k && flatMap[k]) {
      pairs.push({ from: k, to: String(flatMap[k]) });
    }
  }

  pairs.sort((a, b) => b.from.length - a.from.length);
  return pairs;
}

async function downloadAndUnAnonymizeExcel(url, defaultFilename) {
  try {
    const response = await fetch(url);
    if (!response.ok) {
      alert("Ошибка скачивания файла: " + response.statusText);
      return;
    }
    const arrayBuffer = await response.arrayBuffer();

    let filename = defaultFilename || "Отчет.xlsx";
    const disposition = response.headers.get('Content-Disposition');
    if (disposition) {
      const matchUtf = disposition.match(/filename\\*=UTF-8''([^;]+)/i);
      if (matchUtf && matchUtf[1]) {
        filename = decodeURIComponent(matchUtf[1]);
      } else {
        const matchNorm = disposition.match(/filename="?([^";]+)"?/i);
        if (matchNorm && matchNorm[1]) {
          filename = matchNorm[1];
        }
      }
    }

    const pairs = getEmpReplacementPairs();
    let finalBuffer = arrayBuffer;

    if (pairs.length > 0) {
      if (window.JSZip) {
        try {
          const zip = await JSZip.loadAsync(arrayBuffer);
          let modified = false;

          const xmlFiles = Object.keys(zip.files).filter(name => name.endsWith('.xml') || name.endsWith('.rels'));
          
          for (let i = 0; i < xmlFiles.length; i++) {
            const fileName = xmlFiles[i];
            let content = await zip.files[fileName].async('string');
            let fileChanged = false;

            for (let p = 0; p < pairs.length; p++) {
              const item = pairs[p];
              if (content.includes(item.from)) {
                content = content.split(item.from).join(item.to);
                fileChanged = true;
                modified = true;
              }
            }

            if (fileChanged) {
              zip.file(fileName, content);
            }
          }

          if (modified) {
            finalBuffer = await zip.generateAsync({ type: 'arraybuffer', compression: 'DEFLATE' });
          }
        } catch (zipErr) {
          console.error("Ошибка при ZIP разанонимизации:", zipErr);
        }
      }

      if (finalBuffer === arrayBuffer && window.XLSX) {
        try {
          const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array', cellFormulas: true, cellDates: true });
          let modified = false;

          workbook.SheetNames.forEach(sheetName => {
            const sheet = workbook.Sheets[sheetName];
            if (!sheet) return;

            for (let cellRef in sheet) {
              if (cellRef.startsWith('!')) continue;
              const cell = sheet[cellRef];
              if (!cell) continue;

              if (cell.v !== undefined && cell.v !== null) {
                let valStr = String(cell.v);
                let changed = false;

                for (let i = 0; i < pairs.length; i++) {
                  const item = pairs[i];
                  if (valStr.includes(item.from)) {
                    valStr = valStr.split(item.from).join(item.to);
                    changed = true;
                  }
                }

                if (changed) {
                  cell.v = valStr;
                  delete cell.w;
                  delete cell.r;
                  delete cell.h;
                  modified = true;
                }
              }
            }
          });

          if (modified) {
            finalBuffer = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
          }
        } catch (err) {
          console.error("Ошибка при расшифровке ячеек Excel:", err);
        }
      }
    }

    const blob = new Blob([finalBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(link.href), 60000);
  } catch (err) {
    console.error("Ошибка при загрузке отчета:", err);
    alert("Не удалось скачать отчет: " + err.message);
  }
}

/* ==========================================================================
 * Выделение ячеек, строк, столбцов и копирование в формате Excel (TSV) для таблицы сотрудников
 * ========================================================================== */

// Состояние выделения таблицы сотрудников
let empSelection = null;       // { startRow, endRow, startCol, endCol, type: 'cell'|'row'|'col'|'all' }
let empSelectionAnchor = null; // { row, col, type: 'cell'|'row'|'col'|'all' }
let empIsMouseDown = false;
let empDragging = false;
let empRowDragging = false;
let empColDragging = false;

// Установка диапазона выделения ячеек
function setEmpSelection(anchor, focus, type = 'cell') {
  if (!anchor || !focus) return;
  const maxRow = (state?.employees?.length || 1) - 1;
  const maxCol = (headers.employees ? headers.employees.length : 10) - 1;

  const startRow = Math.max(0, Math.min(anchor.row, focus.row));
  const endRow = Math.min(maxRow, Math.max(anchor.row, focus.row));
  const startCol = Math.max(0, Math.min(anchor.col, focus.col));
  const endCol = Math.min(maxCol, Math.max(anchor.col, focus.col));

  empSelection = { startRow, endRow, startCol, endCol, type };
  applyEmpSelectionClasses();
}

// Сброс выделения ячеек таблицы сотрудников
function clearEmpSelection() {
  empSelection = null;
  empSelectionAnchor = null;
  empDragging = false;
  empRowDragging = false;
  empColDragging = false;
  applyEmpSelectionClasses();
}

// Получение текущего диапазона выделения
function getEmpSelection() {
  return empSelection;
}

// Применение визуальной рамки в стиле Excel и фоновой подсветки к выделенным ячейкам
function applyEmpSelectionClasses() {
  const panel = document.getElementById('employees');
  if (!panel) return;

  // Очистка предыдущих классов и стилей
  panel.querySelectorAll('td.emp-cell.selected-cell').forEach(td => {
    td.classList.remove('selected-cell');
    td.style.boxShadow = '';
  });
  panel.querySelectorAll('td.row-num.selected-row-num').forEach(td => {
    td.classList.remove('selected-row-num');
  });
  panel.querySelectorAll('th.emp-col-th.selected-col-th').forEach(th => {
    th.classList.remove('selected-col-th');
  });

  const sel = getEmpSelection();
  if (!sel || !panel.classList.contains('active')) return;

  const rowEls = panel.querySelectorAll('tbody tr');
  const visibleIndices = [];
  for (let r = sel.startRow; r <= sel.endRow; r++) {
    const rowEl = rowEls[r];
    if (rowEl && rowEl.style.display !== 'none') {
      visibleIndices.push(r);
    }
  }

  const maxCol = (headers.employees ? headers.employees.length : 10) - 1;
  const isFullRow = (sel.startCol === 0 && sel.endCol === maxCol);
  const isFullCol = (sel.startRow === 0 && sel.endRow >= (state?.employees ? state.employees.length - 1 : 0));

  for (let i = 0; i < visibleIndices.length; i++) {
    const r = visibleIndices[i];
    const rowEl = rowEls[r];
    if (!rowEl) continue;

    // Подсветка номера строки при полном выделении строки
    if (isFullRow) {
      const rowNumTd = rowEl.querySelector('td.row-num');
      if (rowNumTd) rowNumTd.classList.add('selected-row-num');
    }

    for (let c = sel.startCol; c <= sel.endCol; c++) {
      const cell = rowEl.querySelector(`td.emp-cell[data-col="${c}"]`);
      if (!cell) continue;

      cell.classList.add('selected-cell');

      // Формирование контурной синей рамки выделения диапазона как в Excel
      const shadows = [];
      const isTopEdge = (i === 0) || (visibleIndices[i - 1] !== r - 1);
      const isBottomEdge = (i === visibleIndices.length - 1) || (visibleIndices[i + 1] !== r + 1);

      if (isTopEdge) shadows.push('inset 0 1.5px 0 0 #276ef1');
      if (isBottomEdge) shadows.push('inset 0 -1.5px 0 0 #276ef1');
      if (c === sel.startCol) shadows.push('inset 1.5px 0 0 0 #276ef1');
      if (c === sel.endCol) shadows.push('inset -1.5px 0 0 0 #276ef1');

      if (shadows.length > 0) {
        cell.style.setProperty('box-shadow', shadows.join(', '), 'important');
      } else {
        cell.style.boxShadow = '';
      }
    }
  }

  // Подсветка заголовков столбцов при выделении столбцов целиком
  if (isFullCol) {
    for (let c = sel.startCol; c <= sel.endCol; c++) {
      const colTh = panel.querySelector(`th.emp-col-th[data-col="${c}"]`);
      if (colTh) colTh.classList.add('selected-col-th');
    }
  }
}

// Получение текстового значения ячейки сотрудников (приоритет живому значению из DOM)
function getEmpCellText(r, c) {
  const panel = document.getElementById('employees');
  const td = panel ? panel.querySelector(`td.emp-cell[data-row="${r}"][data-col="${c}"]`) : null;
  if (td) {
    const cb = td.querySelector('input[type="checkbox"]');
    if (cb) return cb.checked ? '1' : '0';
    const inp = td.querySelector('input');
    if (inp) return inp.value;
    const ta = td.querySelector('textarea');
    if (ta) return ta.value;
  }
  const val = state?.employees?.[r]?.[c];
  if (c === 4 || c === 5) return val ? '1' : '0';
  return val !== undefined && val !== null ? String(val) : '';
}

// Форматирование значения ячейки для TSV буфера обмена (экранирование переводов строк и кавычек)
function formatTsvCell(val) {
  const str = val !== undefined && val !== null ? String(val) : '';
  if (str.includes('\t') || str.includes('\n') || str.includes('\r') || str.includes('"')) {
    return '"' + str.replace(/"/g, '""') + '"';
  }
  return str;
}

// Склонение существительных после числительных
function getEmpNoun(number, one, two, five) {
  let n = Math.abs(number);
  n %= 100;
  if (n >= 5 && n <= 20) return five;
  n %= 10;
  if (n === 1) return one;
  if (n >= 2 && n <= 4) return two;
  return five;
}

// Отображение всплывающего уведомления об успешном копировании
function showCopyToast(msg) {
  let toast = document.getElementById('empCopyToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'empCopyToast';
    toast.className = 'copy-toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg || 'Скопировано в буфер обмена';
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => {
    toast.classList.remove('show');
  }, 1800);
}

// Копирование выделенных ячеек таблицы сотрудников в буфер обмена в формате TSV
function copyEmpSelection(event) {
  const sel = getEmpSelection();
  const panel = document.getElementById('employees');
  if (!sel || !panel || !panel.classList.contains('active')) {
    // Если выделения нет, но активна вкладка сотрудников — выделяем всю таблицу и копируем
    if (panel && panel.classList.contains('active') && state?.employees?.length) {
      selectEmpAll();
      return copyEmpSelection(event);
    }
    return false;
  }

  // Если пользователь выделил фрагмент текста вручную внутри поля ввода, даем сработать стандартному копированию
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA') && active.selectionStart !== active.selectionEnd) {
    return false;
  }

  const rowEls = panel.querySelectorAll('tbody tr');
  const lines = [];
  for (let r = sel.startRow; r <= sel.endRow; r++) {
    const rowEl = rowEls[r];
    // Пропуск скрытых строк при фильтрации
    if (rowEl && rowEl.style.display === 'none') continue;
    const rowValues = [];
    for (let c = sel.startCol; c <= sel.endCol; c++) {
      rowValues.push(formatTsvCell(getEmpCellText(r, c)));
    }
    lines.push(rowValues.join('\t'));
  }
  const tsvText = lines.join('\n');
  if (!tsvText) return false;

  if (event?.clipboardData) {
    event.clipboardData.setData('text/plain', tsvText);
    event.preventDefault();
  } else if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(tsvText).catch(() => {
      copyViaTextarea(tsvText);
    });
  } else {
    copyViaTextarea(tsvText);
  }
  showCopyToast(`Скопировано (${lines.length} ${getEmpNoun(lines.length, 'строка', 'строки', 'строк')})`);
  return true;
}

// Вспомогательное копирование через временный textarea для старых браузеров
function copyViaTextarea(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
  } catch (e) {
  } finally {
    ta.remove();
  }
}

// Выделение всех строк и столбцов таблицы сотрудников
function selectEmpAll() {
  const maxRow = (state?.employees?.length || 1) - 1;
  const maxCol = (headers.employees ? headers.employees.length : 10) - 1;
  empSelectionAnchor = { row: 0, col: 0, type: 'all' };
  setEmpSelection({ row: 0, col: 0 }, { row: maxRow, col: maxCol }, 'all');
}

// Обработка нажатия мыши в панели сотрудников (делегирование событий)
function handleEmpMouseDown(e) {
  if (e.button !== 0) return;

  // 1. Клик по угловой ячейке "№" (выделение всей таблицы)
  const corner = e.target.closest('th.emp-corner-th');
  if (corner) {
    e.preventDefault();
    selectEmpAll();
    return;
  }

  // 2. Клик по заголовку столбца (выделение столбца)
  const colTh = e.target.closest('th.emp-col-th');
  if (colTh) {
    const c = Number(colTh.dataset.col);
    const maxRow = (state?.employees?.length || 1) - 1;
    if (e.shiftKey && empSelectionAnchor && empSelectionAnchor.type === 'col') {
      setEmpSelection({ row: 0, col: empSelectionAnchor.col }, { row: maxRow, col: c }, 'col');
    } else {
      empSelectionAnchor = { row: 0, col: c, type: 'col' };
      empIsMouseDown = true;
      empColDragging = true;
      setEmpSelection({ row: 0, col: c }, { row: maxRow, col: c }, 'col');
    }
    e.preventDefault();
    return;
  }

  // 3. Клик по ячейке с номером строки (выделение всей строки)
  const rowNum = e.target.closest('td.row-num');
  if (rowNum) {
    const r = Number(rowNum.dataset.row);
    const maxCol = (headers.employees ? headers.employees.length : 10) - 1;
    if (e.shiftKey && empSelectionAnchor && (empSelectionAnchor.type === 'row' || empSelectionAnchor.type === 'cell')) {
      e.preventDefault();
      setEmpSelection({ row: empSelectionAnchor.row, col: 0 }, { row: r, col: maxCol }, 'row');
    } else {
      empSelectionAnchor = { row: r, col: 0, type: 'row' };
      empIsMouseDown = true;
      empRowDragging = true;
      setEmpSelection({ row: r, col: 0 }, { row: r, col: maxCol }, 'row');
      selected.employees = r;
    }
    return;
  }

  // 4. Клик по ячейке данных
  const cell = e.target.closest('td.emp-cell');
  if (cell) {
    const r = Number(cell.dataset.row);
    const c = Number(cell.dataset.col);
    if (e.shiftKey && empSelectionAnchor) {
      e.preventDefault();
      setEmpSelection(empSelectionAnchor, { row: r, col: c }, 'cell');
      return;
    }
    empSelectionAnchor = { row: r, col: c, type: 'cell' };
    empIsMouseDown = true;
    empDragging = false;
    setEmpSelection({ row: r, col: c }, { row: r, col: c }, 'cell');
    selected.employees = r;
    // preventDefault не вызывается, чтобы текстовое поле получало фокус и каретку для редактирования
  }
}

// Обработка протягивания мыши для выделения диапазона ячеек
function handleEmpMouseOver(e) {
  if (!empIsMouseDown || !(e.buttons & 1)) {
    empIsMouseDown = false;
    empDragging = false;
    empRowDragging = false;
    empColDragging = false;
    return;
  }

  // Протягивание по заголовкам столбцов
  if (empColDragging) {
    const colTh = e.target.closest('th.emp-col-th');
    if (colTh && empSelectionAnchor) {
      const c = Number(colTh.dataset.col);
      const maxRow = (state?.employees?.length || 1) - 1;
      setEmpSelection({ row: 0, col: empSelectionAnchor.col }, { row: maxRow, col: c }, 'col');
    }
    return;
  }

  // Протягивание по номерам строк
  if (empRowDragging) {
    const rowNum = e.target.closest('td.row-num');
    if (rowNum && empSelectionAnchor) {
      const r = Number(rowNum.dataset.row);
      const maxCol = (headers.employees ? headers.employees.length : 10) - 1;
      setEmpSelection({ row: empSelectionAnchor.row, col: 0 }, { row: r, col: maxCol }, 'row');
    }
    return;
  }

  // Протягивание по ячейкам данных
  if (empSelectionAnchor && empSelectionAnchor.type === 'cell') {
    const cell = e.target.closest('td.emp-cell');
    if (!cell) return;
    const r = Number(cell.dataset.row);
    const c = Number(cell.dataset.col);
    if (r !== empSelectionAnchor.row || c !== empSelectionAnchor.col) {
      empDragging = true;
      if (document.activeElement && (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT')) {
        document.activeElement.blur();
      }
      window.getSelection()?.removeAllRanges();
      setEmpSelection(empSelectionAnchor, { row: r, col: c }, 'cell');
    }
  }
}

// Инициализация обработчиков событий для таблицы сотрудников
function initEmpTableSelection() {
  const empPanel = document.getElementById('employees');
  if (empPanel) {
    empPanel.addEventListener('mousedown', handleEmpMouseDown);
    empPanel.addEventListener('mouseover', handleEmpMouseOver);
  }

  // Сброс состояния перетаскивания при отпускании кнопки мыши
  window.addEventListener('mouseup', () => {
    empIsMouseDown = false;
    empDragging = false;
    empRowDragging = false;
    empColDragging = false;
  });

  // Сброс выделения при клике вне панели сотрудников
  document.addEventListener('mousedown', (e) => {
    if (!e.target.closest('#employees') && !e.target.closest('.copy-toast')) {
      if (empSelection) clearEmpSelection();
    }
  });

  // Горячие клавиши Ctrl+C, Ctrl+A и стрелки навигации
  document.addEventListener('keydown', (e) => {
    const panel = document.getElementById('employees');
    if (!panel || !panel.classList.contains('active')) return;

    const isCtrlOrMeta = e.ctrlKey || e.metaKey;
    const key = e.key.toLowerCase();

    // Escape — сброс выделения
    if (e.key === 'Escape') {
      clearEmpSelection();
      return;
    }

    // Ctrl+A — выделить всю таблицу
    if (isCtrlOrMeta && (key === 'a' || key === 'ф')) {
      const active = document.activeElement;
      const isEditingText = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
      if (!isEditingText) {
        e.preventDefault();
        selectEmpAll();
        return;
      }
    }

    // Ctrl+C — копировать выделенное
    if (isCtrlOrMeta && (key === 'c' || key === 'с')) {
      if (empSelection) {
        const copied = copyEmpSelection(e);
        if (copied && e.preventDefault) {
          // Скопировано
        }
      }
    }

    // Навигация стрелками при неактивном текстовом поле
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
      const active = document.activeElement;
      const isEditing = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
      if (!isEditing && empSelection) {
        e.preventDefault();
        const maxRow = (state?.employees?.length || 1) - 1;
        const maxCol = (headers.employees ? headers.employees.length : 10) - 1;
        const focus = { row: empSelection.endRow, col: empSelection.endCol };
        if (key === 'arrowup') focus.row = Math.max(0, focus.row - 1);
        else if (key === 'arrowdown') focus.row = Math.min(maxRow, focus.row + 1);
        else if (key === 'arrowleft') focus.col = Math.max(0, focus.col - 1);
        else if (key === 'arrowright') focus.col = Math.min(maxCol, focus.col + 1);

        if (e.shiftKey) {
          setEmpSelection(empSelectionAnchor || focus, focus, 'cell');
        } else {
          empSelectionAnchor = focus;
          setEmpSelection(focus, focus, 'cell');
        }
      }
    }
  });

  // Обработка стандартного события копирования страницы
  document.addEventListener('copy', (e) => {
    const panel = document.getElementById('employees');
    if (!panel || !panel.classList.contains('active')) return;
    if (empSelection) {
      copyEmpSelection(e);
    }
  });
}
