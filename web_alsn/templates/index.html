<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>АЛСН</title>
  <link rel="stylesheet" href="{{APP_PREFIX}}/static/style.css?v={{APP_VERSION}}">
  <script>
    var _prefix = "{{APP_PREFIX}}";
    var _canEdit = "{{CAN_EDIT}}";
    window.APP_CONFIG = {
      APP_PREFIX: _prefix,
      CAN_EDIT: _canEdit === "true",
      MAIN_SITE_URL: "{{MAIN_SITE_URL}}" || "http://yrtps.ru"
    };
  </script>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <!-- Верхняя строка: заголовок и функциональные кнопки -->
      <div class="topbar-row">
        <div class="titlebox">
          <h1>АЛСН</h1>
        </div>
        <div class="controls">
          <a class="home-link" href="{{MAIN_SITE_URL}}/" onclick="return requestHomeClick(event)">На главную</a>
          <div class="toolbar">
            <button onclick="addRow()">+ строку</button>
            <button onclick="removeRow()">- строку</button>
            <button id="cancelBtn" title="Отмена (Ctrl+Z)" aria-label="Отмена" onclick="cancelChanges()" disabled>↺</button>
            <button id="restoreBtn" title="Вернуть (Ctrl+Y)" aria-label="Вернуть" onclick="restoreChanges()" disabled>↻</button>
            <button onclick="loadState()">Обновить</button>
            <button id="saveBtn" onclick="saveState()">Сохранить</button>
          </div>
        </div>
      </div>

      <!-- Разделитель между строками -->
      <div class="topbar-divider"></div>

      <!-- Нижняя строка: вкладки разделов -->
      <div class="tabs" role="tablist" aria-label="Разделы">
        <button id="tabLoc" class="tab active" type="button" onclick="setTab('locomotives')">Локомотивы</button>
        <button id="tabWh" class="tab" type="button" onclick="setTab('warehouse')">Список ПБ</button>
      </div>
    </div>

    <div class="panel">
      <div class="tab-content active" id="tab-locomotives">
        <div id="locBody" class="loc-grid"></div>
      </div>

      <div class="tab-content" id="tab-warehouse">
        <div class="warehouse-head">
          <div class="section-title">Список ПБ</div>
          <div class="warehouse-filters">
            <label>
              Номер
              <input type="text" id="warehouseNumberFilter" placeholder="Поиск..." style="width: 80px;" oninput="setWarehouseFilter('number', this.value)">
            </label>
            <label>
              Тип прибора
              <select id="warehouseTypeFilter" onchange="setWarehouseFilter('type', this.value)">
                <option value="">Все типы</option>
              </select>
            </label>
            <label>
              След. месяц проверки
              <select id="warehouseNextMonthFilter" onchange="setWarehouseFilter('nextMonth', this.value)">
                <option value="">Все месяцы</option>
              </select>
            </label>
            <label>
              Место нахождения
              <select id="warehouseLocationFilter" onchange="setWarehouseFilter('location', this.value)">
                <option value="">Все места</option>
              </select>
            </label>
            <button type="button" onclick="clearWarehouseFilters()">Сбросить</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="alsn-table">
            <colgroup>
              <col style="width: 200px;">
              <col style="width: 170px;">
              <col style="width: 170px;">
              <col style="width: 160px;">
              <col style="width: 190px;">
              <col style="width: 240px;">
            </colgroup>
            <thead>
              <tr>
                <th>Тип прибора</th>
                <th>№ прибора</th>
                <th>Дата поверки</th>
                <th>Периодичность</th>
                <th>След. дата поверки</th>
                <th>Место нахождения</th>
              </tr>
            </thead>
            <tbody id="whBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <!-- Модальное окно подтверждения при несохранённых изменениях -->
  <div id="unsavedChangesModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(16,32,51,0.48); z-index:99999; align-items:center; justify-content:center; backdrop-filter:blur(4px);">
    <div style="background:#ffffff; border-radius:16px; padding:24px 28px; max-width:440px; width:90%; box-shadow:0 16px 40px rgba(16,32,51,0.2); text-align:center; font-family:inherit; border:1px solid #d9e2ef;">
      <h3 style="margin:0 0 10px; font-size:18px; color:#102033; font-weight:700;">Несохранённые изменения</h3>
      <p id="unsavedChangesMessage" style="margin:0 0 20px; font-size:14px; color:#475569; line-height:1.45;">Есть несохранённые изменения. Сохранить их перед переходом?</p>
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button id="unsavedSaveBtn" type="button" class="primary" style="padding:9px 18px; border-radius:8px; font-weight:600; cursor:pointer;">Сохранить</button>
        <button id="unsavedDiscardBtn" type="button" style="padding:9px 18px; border-radius:8px; font-weight:600; cursor:pointer; background:#ffffff; border:1px solid #cbd5e1; color:#334155;">Не сохранять</button>
        <button id="unsavedCancelBtn" type="button" style="padding:9px 18px; border-radius:8px; font-weight:600; cursor:pointer; background:#ffffff; border:1px solid #cbd5e1; color:#64748b;">Отмена</button>
      </div>
    </div>
  </div>

  <script src="{{APP_PREFIX}}/static/script.js?v={{APP_VERSION}}"></script>
</body>
</html>
